name: build

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

jobs:
  # One definition of what this build is called, so the two build jobs and the
  # release job cannot drift apart. A tag builds under its own name; anything
  # else carries the version it was cut from plus the run it came out of and
  # the commit it was built from, which is enough to trace a stray zip back.
  label:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the build label
        id: pick
        run: |
          ver=$(sed -n 's/^project(.* VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            label=$GITHUB_REF_NAME
          else
            label="$ver-run$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Build label: $label"

  macos:
    needs: label
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure (universal binary)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --parallel 3

      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          name: nimbostratus-${{ needs.label.outputs.label }}-macos-universal
          path: |
            build/bin/nimbostratus.vst3
            build/bin/nimbostratus.clap

  windows:
    needs: label
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 3

      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          name: nimbostratus-${{ needs.label.outputs.label }}-windows-x64
          path: |
            build/bin/nimbostratus.vst3
            build/bin/nimbostratus.clap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [label, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches project version
        run: |
          ver=$(sed -n 's/^project(.* VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          tag=${GITHUB_REF_NAME#v}
          base=${tag%%-*}  # strip prerelease suffix, e.g. 1.3.1-rc.1 -> 1.3.1
          if [ "$ver" != "$base" ]; then
            echo "::error::Tag v$tag does not match CMake project version $ver — bump CMakeLists.txt first" >&2
            exit 1
          fi
          echo "Releasing version $tag"

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # On a tag the label is the tag name, so the zips keep the names they
      # have always had.
      - name: Package release zips
        env:
          LABEL: ${{ needs.label.outputs.label }}
        run: |
          (cd "artifacts/nimbostratus-$LABEL-macos-universal" && zip -qr "$GITHUB_WORKSPACE/nimbostratus-$LABEL-macos-universal.zip" .)
          (cd "artifacts/nimbostratus-$LABEL-windows-x64" && zip -qr "$GITHUB_WORKSPACE/nimbostratus-$LABEL-windows-x64.zip" .)
          ls -la *.zip

      # Two steps, because this repo has immutable releases turned on: once a
      # release is published its assets are frozen, and the action uploads
      # after publishing. Building it as a draft lets the zips land first.
      #
      # For the same reason, never create the release by hand before this runs.
      # Publishing a release burns the tag name permanently - the tag cannot be
      # re-pushed and no later release can claim it, even after the release is
      # deleted. Push the tag and let this job do the rest.
      - name: Stage GitHub Release as a draft
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          files: nimbostratus-*.zip

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease=${{ contains(github.ref_name, '-') }}
